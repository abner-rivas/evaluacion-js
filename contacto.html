<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'self';">
  <title>Contacto - Josias Rivas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <nav class="nav" aria-label="Navegación principal">
      <a href="index.html" class="nav__brand">Josias Rivas</a>
      <ul class="nav__list">
        <li class="nav__item"><a href="index.html" class="nav__link">Inicio</a></li>
        <li class="nav__item"><a href="acerca.html" class="nav__link">Acerca de mí</a></li>
        <li class="nav__item"><a href="proyectos.html" class="nav__link">Proyectos</a></li>
        <li class="nav__item"><a href="contacto.html" class="nav__link nav__link--active">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main class="main-layout">
    
    <section class="contact-section" aria-labelledby="contact-title">
      <h1 id="contact-title" class="contact-section__title">Contacto</h1>
      <p class="contact-section__desc">
        Formulario para enviar consultas o propuestas de proyectos.
      </p>

      <form action="#" method="POST" class="form">
        
        <div class="form__group">
          <label for="nombre" class="form__label">Nombre completo</label>
          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            class="form__input" 
            placeholder="Tu nombre" 
            required 
            maxlength="60">
        </div>

        <div class="form__group">
          <label for="email" class="form__label">Correo electronico</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form__input" 
            placeholder="correo@ejemplo.com" 
            required 
            maxlength="80">
        </div>

        <div class="form__group">
          <label for="clave" class="form__label">Contraseña temporal</label>
          <input 
            type="password" 
            id="clave" 
            name="clave" 
            class="form__input" 
            placeholder="Minimo 8 caracteres" 
            required 
            minlength="8" 
            maxlength="30">
          <span class="form__hint">Debe tener al menos 8 caracteres</span>
        </div>

        <div class="form__group">
          <label for="asunto" class="form__label">Motivo de contacto</label>
          <select id="asunto" name="asunto" class="form__select" required>
            <option value="" disabled selected>Selecciona una opcion</option>
            <option value="proyecto">Proyecto de desarrollo</option>
            <option value="machine-learning">Consulta sobre Machine Learning</option>
            <option value="laboral">Oportunidad de trabajo</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <fieldset class="form__fieldset">
          <legend class="form__legend">Preferencia de respuesta</legend>
          <div class="form__options-row">
            <label class="form__option-label">
              <input type="radio" name="preferencia" value="correo" checked required>
              Correo electronico
            </label>
            <label class="form__option-label">
              <input type="radio" name="preferencia" value="telefono">
              Telefono
            </label>
            <label class="form__option-label">
              <input type="radio" name="preferencia" value="mensaje">
              Mensaje directo
            </label>
          </div>
        </fieldset>

        <div class="form__group">
          <label for="archivo" class="form__label">Adjuntar archivo</label>
          <input 
            type="file" 
            id="archivo" 
            name="archivo" 
            class="form__input" 
            accept=".pdf,.png,.jpg,.jpeg">
          <span class="form__hint">Formatos aceptados: .pdf, .png, .jpg</span>
        </div>

        <div class="form__group">
          <label for="mensaje" class="form__label">Mensaje</label>
          <textarea 
            id="mensaje" 
            name="mensaje" 
            rows="4" 
            class="form__textarea" 
            placeholder="Escribe aqui tu mensaje" 
            required 
            maxlength="400"></textarea>
        </div>

        <div class="form__group">
          <label class="form__option-label">
            <input type="checkbox" id="terminos" name="terminos" required>
            Acepto el envio de esta informacion
          </label>
        </div>

        <button type="submit" class="btn-enviar">Enviar</button>

      </form>
    </section>

  </main>

  <footer class="footer">
    <p class="footer__text">&copy; 2026 Josias Rivas - Portafolio personal</p>
  </footer>

</body>
</html>
